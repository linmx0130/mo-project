[workspace]
resolver = "3"
members = ["crates/mo_core", "crates/mo_gateway", "crates/mo_worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
